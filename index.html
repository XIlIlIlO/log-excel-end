<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>백테스트 통합 분석 도구 (Ultra Pro - Auto Sum + MDD)</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            margin: 0;
        }
        .main-container { max-width: 1200px; margin: 0 auto; }
        .header { text-align: center; color: white; margin-bottom: 30px; }
        .header h1 { margin: 0; font-size: 2.5em; }
        .header p { margin: 5px 0 0 0; font-size: 1.1em; opacity: 0.9; }
        .wrapper { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        @media (max-width: 1024px) { .wrapper { grid-template-columns: 1fr; } }
        .card {
            background: white; border-radius: 12px; padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2); transition: transform 0.3s;
        }
        .card:hover { transform: translateY(-5px); }
        .card h2 { margin-top: 0; color: #333; border-bottom: 3px solid #667eea; padding-bottom: 10px; }
        .badge { display: inline-block; padding: 6px 14px; border-radius: 20px; font-size: 0.85rem; font-weight: bold; color: white; margin-bottom: 15px; }
        .badge-blue { background-color: #667eea; }
        .badge-purple { background-color: #764ba2; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; color: #555; font-size: 0.95rem; }
        input[type="number"], input[type="file"], select {
            width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px;
            font-size: 1rem; font-family: inherit; transition: border-color 0.3s;
        }
        input[type="number"]:focus, input[type="file"]:focus, select:focus { outline: none; border-color: #667eea; }
        button {
            width: 100%; padding: 14px; border: none; border-radius: 8px; font-size: 1rem;
            font-weight: bold; cursor: pointer; transition: all 0.3s; font-family: inherit; margin-top: 10px;
        }
        .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .btn-primary:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        .status-msg {
            margin-top: 15px; padding: 12px; border-radius: 8px; font-size: 0.95rem; text-align: center;
            min-height: 40px; display: flex; align-items: center; justify-content: center;
        }
        .status-msg.info { background: #e3f2fd; color: #1976d2; }
        .status-msg.success { background: #e8f5e9; color: #388e3c; font-weight: bold; }
        .status-msg.error { background: #ffebee; color: #d32f2f; font-weight: bold; }
        .progress-container { display: none; margin-top: 15px; }
        .progress-bar-bg { width: 100%; height: 8px; background: #e0e0e0; border-radius: 4px; overflow: hidden; }
        .progress-bar { height: 100%; background: linear-gradient(90deg, #667eea, #764ba2); width: 0%; transition: width 0.3s; }
        .progress-text { text-align: center; font-size: 0.85rem; color: #666; margin-top: 8px; }
        .groups-section {
            background: white; border-radius: 12px; padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2); margin-bottom: 20px;
        }
        .groups-section h2 { margin-top: 0; color: #333; border-bottom: 3px solid #667eea; padding-bottom: 10px; }
        .groups-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-top: 20px; }
        .group-card {
            background: #f8f9fa; border: 2px solid #e0e0e0; border-radius: 8px; padding: 15px;
            text-align: center; transition: all 0.3s;
        }
        .group-card:hover { border-color: #667eea; background: #f0f4ff; }
        .group-name { font-weight: bold; color: #333; margin-bottom: 10px; font-size: 1.1em; }
        .group-btn {
            width: 100%; padding: 10px; background: #667eea; color: white; border: none; border-radius: 6px;
            cursor: pointer; font-weight: 600; transition: all 0.3s;
        }
        .group-btn:hover { background: #764ba2; transform: translateY(-2px); }
        .group-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="main-container">
    <div class="header">
        <h1>📊 백테스트 통합 분석 도구</h1>
        <p>Ultra Pro - 개별 그룹 / 합산 결과 MDD 자동 반영</p>
    </div>

    <div class="wrapper">
        <div class="card">
            <span class="badge badge-blue">Step 1</span>
            <h2>📁 로그 파일 업로드</h2>
            
            <div class="form-group">
                <label for="logFiles">.log 파일 선택 (여러 개 선택 가능)</label>
                <input type="file" id="logFiles" accept=".log,.txt" multiple>
            </div>

            <div class="form-group">
                <label for="lossValue">예상 손절 금액 (USDT)</label>
                <input type="number" id="lossValue" value="834" min="0" step="0.01">
            </div>

            <button class="btn-primary" onclick="processAllLogs()">파일 분석 & 그룹 분류</button>
            <div id="statusUpload" class="status-msg info">파일을 선택해주세요.</div>
            
            <div class="progress-container" id="progressContainer">
                <div class="progress-bar-bg">
                    <div class="progress-bar" id="progressBar"></div>
                </div>
                <div class="progress-text"><span id="progressText">0%</span></div>
            </div>
        </div>

        <div class="card">
            <span class="badge badge-purple">Step 2</span>
            <h2>📥 설정 & 초기화</h2>
            
            <div class="form-group">
                <label for="groupSelectMode">그룹 처리 방식</label>
                <select id="groupSelectMode">
                    <option value="all">모든 그룹 다운로드</option>
                    <option value="individual">개별 그룹 선택</option>
                </select>
            </div>

            <button class="btn-primary" onclick="showGroupSelection()" id="showGroupBtn" disabled>
                그룹별 다운로드 준비
            </button>
            
            <button class="btn-primary" onclick="downloadAllGroups()" id="downloadAllBtn" disabled style="background: linear-gradient(135deg, #4caf50 0%, #45a049 100%);">
                모든 그룹 일괄 다운로드
            </button>

            <div id="statusConfig" class="status-msg info">파일 분석 후 활성화 됩니다.</div>
        </div>
    </div>

    <div class="groups-section" id="groupsSection" style="display: none;">
        <h2>🎯 분류된 그룹</h2>
        <div class="groups-grid" id="groupsGrid"></div>
    </div>
</div>

<script>
    let groupFiles = {};
    const CHUNK_SIZE = 5 * 1024 * 1024; // 5MB Chunk

    function cleanNumber(valueStr) {
        if (valueStr === null || valueStr === undefined || valueStr === "") return 0;
        if (typeof valueStr === 'number') return valueStr;

        const cleanStr = String(valueStr).replace(/[^\d.-]/g, '');
        const num = parseFloat(cleanStr);
        return isNaN(num) ? 0 : num;
    }

    function getLineValue(line) {
        const idx = line.indexOf(':');
        if (idx === -1) return "";
        return line.slice(idx + 1).trim();
    }

    function calculateWinRate(winCount, lossCount) {
        if (winCount === 0) return "-";
        const total = winCount + lossCount;
        if (total === 0) return "-";
        return ((winCount / total) * 100).toFixed(3) + "%";
    }

    function formatDateTime(val) {
        if (!val) return "";
        const str = String(val).trim();

        const match = str.match(/(\d{4})[-\/](\d{2})[-\/](\d{2})\s+(\d{2}):(\d{2})/);
        if (match) {
            return `${match[1]}-${match[2]}-${match[3]} ${match[4]}:${match[5]}`;
        }

        return str;
    }

    function parseMddLine(line) {
        const raw = getLineValue(line);

        const beforeParen = raw.split('(')[0].trim();
        const mddValue = cleanNumber(beforeParen);

        const timeMatch = raw.match(/\(([^)]+)\)/);
        const mddTime = timeMatch ? formatDateTime(timeMatch[1]) : "";

        return {
            value: mddValue,
            time: mddTime
        };
    }

    function applyExcelStyle(ws, headerRowIndex1, headerRowIndex2) {
    ws['!cols'] = [
        {wch: 22}, {wch: 18}, {wch: 18},
        {wch: 17}, {wch: 17}, {wch: 17}, {wch: 17}, {wch: 17}, {wch: 17}, {wch: 17}, {wch: 17}, {wch: 17},
        {wch: 49}, {wch: 33}, {wch: 17}
    ];

    const range = XLSX.utils.decode_range(ws['!ref']);

    for (let R = range.s.r; R <= range.e.r; ++R) {
        for (let C = range.s.c; C <= range.e.c; ++C) {
            const cellAddress = XLSX.utils.encode_cell({r: R, c: C});
            if (!ws[cellAddress]) continue;

            let style = {
                font: { name: "맑은 고딕", sz: 11 },
                alignment: { 
                    vertical: "center",
                    wrapText: true
                },
                border: {
                    top: { style: "thin", color: { rgb: "D3D3D3" } },
                    bottom: { style: "thin", color: { rgb: "D3D3D3" } },
                    left: { style: "thin", color: { rgb: "D3D3D3" } },
                    right: { style: "thin", color: { rgb: "D3D3D3" } }
                }
            };

            if (R === headerRowIndex1 || R === headerRowIndex2) {
                style.alignment.horizontal = "center";
                style.font.bold = true;
                style.fill = { fgColor: { rgb: "F2F2F2" } };
            } else {
                if (C === 0) {
                    if (R === headerRowIndex1 + 1) style.alignment.horizontal = "center";
                    else style.alignment.horizontal = "left";
                } else if (C === 1 || C === 2 || C === 12) {
                    style.alignment.horizontal = "center";
                } else {
                    style.alignment.horizontal = "right";
                }
            }

            ws[cellAddress].s = style;
        }
    }
}

    class StreamLogParser {
        constructor(fileName) {
            this.fileName = fileName;
            this.groupIndex = 0;

            this.currentRecord = {};
            this.currentType = null; 
            // currentType:
            // null  : 아직 백테스트 Report 진입 전
            // group : 개별 그룹 Backtest Report
            // total : [Backtest Report] 백테스팅 합산 결과

            this.currentBatchGroups = [];
            this.currentBatchTotal = null;
        }

        hasCurrentBatchData() {
            return this.currentBatchGroups.length > 0 || this.currentBatchTotal !== null;
        }

        processRecord(rec) {
            const lossCount = rec.raw_loss_count || 0;
            const winCount = rec.raw_win_count || 0;
            const profit = rec.raw_profit || 0;
            const fee = rec.raw_fee || 0;

            const userLossValue = parseFloat(document.getElementById('lossValue').value) || 834;
            
            const calculatedLoss = userLossValue * lossCount;
            const realizedPnl = profit - calculatedLoss - fee;
            const unrealizedPnl = (rec.last_equity || 0) - (rec.last_balance || 0);
            
            rec.calc_loss_amount = calculatedLoss;
            rec.calc_realized_pnl = realizedPnl;
            rec.calc_unrealized_pnl = unrealizedPnl;
            rec.calc_net_profit = realizedPnl + unrealizedPnl;
            rec.calc_win_rate = calculateWinRate(winCount, lossCount);

            if (rec.mdd_value === undefined) rec.mdd_value = "";
            if (rec.mdd_time === undefined) rec.mdd_time = "";
        }

        pushCurrentRecord() {
            if (Object.keys(this.currentRecord).length === 0) return;

            this.processRecord(this.currentRecord);

            if (this.currentType === 'group') {
                this.currentBatchGroups.push(this.currentRecord);
            } else if (this.currentType === 'total') {
                this.currentBatchTotal = this.currentRecord;
            }

            this.currentRecord = {};
        }

        finalizeGroupSection() {
            this.pushCurrentRecord();

            if (!this.hasCurrentBatchData()) {
                this.currentRecord = {};
                this.currentBatchGroups = [];
                this.currentBatchTotal = null;
                this.currentType = null;
                return;
            }

            const groupKey = `Group_${this.groupIndex}`;
            if (!groupFiles[groupKey]) groupFiles[groupKey] = [];

            groupFiles[groupKey].push({
                fileName: this.fileName,
                data: {
                    groups: [...this.currentBatchGroups],
                    total: this.currentBatchTotal
                }
            });

            this.groupIndex++;

            this.currentRecord = {};
            this.currentBatchGroups = [];
            this.currentBatchTotal = null;
            this.currentType = null;
        }

        parseLine(line) {
            line = line.trim();
            if (!line) return;

            const isSeparator = line.includes("모든 그룹에 대한 백테스트 완료");
            if (isSeparator) {
                this.finalizeGroupSection();
                return;
            }

            const isReportHeader = line.includes("[Backtest Report]");
            const isTotalHeader = line.includes("백테스팅 합산 결과");

            if (isReportHeader) {
                const previousType = this.currentType;

                this.pushCurrentRecord();

                // 합산 결과가 끝난 뒤 바로 다음 [Backtest Report]가 오면
                // 하나의 백테스트 묶음이 끝난 것으로 보고 엑셀 분리 기준을 유지한다.
                if (
                    previousType === 'total' &&
                    !isTotalHeader &&
                    this.hasCurrentBatchData()
                ) {
                    this.finalizeGroupSection();
                }

                this.currentRecord = {};
                this.currentType = isTotalHeader ? 'total' : 'group';
                return;
            }

            if (this.currentType !== 'group' && this.currentType !== 'total') {
                return;
            }

            if (line.includes("- Group Name")) {
                this.currentRecord.GroupName = getLineValue(line);
            } else if (line.includes("- 전체 그룹 수")) {
                this.currentRecord.TotalGroups = cleanNumber(getLineValue(line));
            } else if (line.includes("- 시작일")) {
                this.currentRecord.StartDate = formatDateTime(getLineValue(line));
            } else if (line.includes("- 종료일")) {
                this.currentRecord.EndDate = formatDateTime(getLineValue(line));
            } else if (line.includes("- Start Balance")) {
                this.currentRecord.start_balance = cleanNumber(getLineValue(line));
            } else if (line.includes("- Last Balance")) {
                this.currentRecord.last_balance = cleanNumber(getLineValue(line));
            } else if (line.includes("- Last Equity")) {
                this.currentRecord.last_equity = cleanNumber(getLineValue(line));
            } else if (line.includes("- 총 익절 회수")) {
                this.currentRecord.raw_win_count = cleanNumber(getLineValue(line));
            } else if (line.includes("- 총 손절 회수")) {
                this.currentRecord.raw_loss_count = cleanNumber(getLineValue(line));
            } else if (line.includes("- 익절금액") || line.includes("- 익절 금액")) {
                this.currentRecord.raw_profit = cleanNumber(getLineValue(line));
            } else if (line.includes("- 손절금액") || line.includes("- 손절 금액")) {
                this.currentRecord.raw_loss_amount_from_log = cleanNumber(getLineValue(line));
            } else if (line.includes("- Total 수수료")) {
                this.currentRecord.raw_fee = cleanNumber(getLineValue(line));
            } else if (line.includes("- 최대 미실현 손익")) {
                const mdd = parseMddLine(line);
                this.currentRecord.mdd_value = mdd.value;
                this.currentRecord.mdd_time = mdd.time;
            }
        }
    }

    function processAllLogs() {
        const fileInputs = document.getElementById('logFiles');
        const statusDiv = document.getElementById('statusUpload');
        const progressContainer = document.getElementById('progressContainer');

        if (!fileInputs.files.length) {
            statusDiv.className = 'status-msg error';
            statusDiv.innerText = '❌ 파일을 선택해주세요.';
            return;
        }

        statusDiv.className = 'status-msg info';
        statusDiv.innerText = '⏳ GB급 대용량 처리 모드 (메모리 보호 중...)';
        progressContainer.style.display = 'block';
        
        const totalFiles = fileInputs.files.length;
        groupFiles = {}; 

        const processFile = (fileIndex) => {
            if (fileIndex >= totalFiles) {
                finishProcessing();
                return;
            }

            const file = fileInputs.files[fileIndex];
            const fileSize = file.size;
            let offset = 0;
            let chunkReader = new FileReader();
            let leftover = ""; 
            let parser = new StreamLogParser(file.name);

            chunkReader.onload = function(e) {
                const chunkText = e.target.result;
                let data = leftover + chunkText;
                
                e.target.result = null; 

                let lastNewlineIndex = 0;
                let nextNewlineIndex = 0;

                while ((nextNewlineIndex = data.indexOf('\n', lastNewlineIndex)) > -1) {
                    const rawLine = data.substring(lastNewlineIndex, nextNewlineIndex);
                    const line = (' ' + rawLine).slice(1); 
                    
                    if (line.trim().length > 0) {
                        parser.parseLine(line);
                    }

                    lastNewlineIndex = nextNewlineIndex + 1;
                }

                leftover = (' ' + data.substring(lastNewlineIndex)).slice(1);
                data = null; 

                offset += CHUNK_SIZE;

                const percent = fileSize === 0 ? 100 : Math.min(100, Math.round((offset / fileSize) * 100));
                const totalProgress = Math.round(((fileIndex * 100) + percent) / totalFiles);
                
                document.getElementById('progressBar').style.width = totalProgress + '%';
                document.getElementById('progressText').innerText = `파일 ${fileIndex + 1}/${totalFiles}: ${percent}% (RAM 정리중)`;

                if (offset < fileSize) {
                    setTimeout(readNextChunk, 0);
                } else {
                    if (leftover && leftover.trim().length > 0) {
                        parser.parseLine(leftover);
                    }

                    parser.finalizeGroupSection();
                    
                    parser = null;
                    chunkReader = null;
                    leftover = null;

                    document.getElementById('progressText').innerText = `RAM 정리 중...`;
                    setTimeout(() => processFile(fileIndex + 1), 1000);
                }
            };

            chunkReader.onerror = function() {
                console.error("File Read Error", chunkReader.error);
                statusDiv.className = 'status-msg error';
                statusDiv.innerText = `❌ ${file.name} 읽기 실패!`;
            };

            function readNextChunk() {
                const slice = file.slice(offset, offset + CHUNK_SIZE);
                chunkReader.readAsText(slice, 'UTF-8');
            }

            readNextChunk();
        };

        processFile(0);
    }

    function finishProcessing() {
        const statusDiv = document.getElementById('statusUpload');
        const progressContainer = document.getElementById('progressContainer');
        
        if (Object.keys(groupFiles).length === 0) {
            statusDiv.className = 'status-msg error';
            statusDiv.innerText = '❌ 유효한 데이터를 찾을 수 없습니다.';
            return;
        }

        statusDiv.className = 'status-msg success';
        statusDiv.innerText = `✅ 분석 완료! ${Object.keys(groupFiles).length}개 백테스트 묶음 발견됨`;
        
        setTimeout(() => {
            progressContainer.style.display = 'none';
        }, 1500);

        document.getElementById('showGroupBtn').disabled = false;
        document.getElementById('downloadAllBtn').disabled = false;
    }

    function showGroupSelection() {
        const section = document.getElementById('groupsSection');
        const grid = document.getElementById('groupsGrid');
        grid.innerHTML = '';

        const sortedGroups = Object.keys(groupFiles).sort((a, b) => {
            const numA = parseInt(a.split('_')[1]);
            const numB = parseInt(b.split('_')[1]);
            return numA - numB;
        });

        sortedGroups.forEach(groupKey => {
            const groupNum = groupKey.split('_')[1];
            const groupLabel = String.fromCharCode(65 + parseInt(groupNum));
            
            const card = document.createElement('div');
            card.className = 'group-card';
            card.innerHTML = `
                <div class="group-name">그룹 ${groupLabel}</div>
                <p style="color: #666; font-size: 0.9em; margin: 5px 0;">
                    ${groupFiles[groupKey].length}개 파일 포함
                </p>
                <button class="group-btn" onclick="downloadGroup('${groupKey}', '${groupLabel}')">
                    다운로드
                </button>
            `;
            grid.appendChild(card);
        });

        section.style.display = 'block';
        section.scrollIntoView({ behavior: 'smooth' });
    }

    function findWorstMdd(records) {
        let worstValue = null;
        let worstTime = "";

        records.forEach(r => {
            if (!r) return;

            const value = r.mdd_value;

            if (typeof value === 'number' && !isNaN(value)) {
                if (worstValue === null || value < worstValue) {
                    worstValue = value;
                    worstTime = r.mdd_time || "";
                }
            }
        });

        return {
            value: worstValue === null ? "" : worstValue,
            time: worstTime
        };
    }

    function buildTopSummary(totalRecords, allGroups) {
    const recordsToSum = totalRecords.length > 0 ? totalRecords : allGroups;

    let sumProfit = 0;
    let sumLossAmount = 0;
    let sumFee = 0;
    let sumRealized = 0;
    let sumUnrealized = 0;
    let sumNetProfit = 0;
    let sumWinCount = 0;
    let sumLossCount = 0;

    let minStartDate = "";
    let maxEndDate = "";

    recordsToSum.forEach(r => {
        sumProfit += (r.raw_profit || 0);
        sumLossAmount += (r.calc_loss_amount || 0);
        sumFee += (r.raw_fee || 0);
        sumRealized += (r.calc_realized_pnl || 0);
        sumUnrealized += (r.calc_unrealized_pnl || 0);
        sumNetProfit += (r.calc_net_profit || 0);
        sumWinCount += (r.raw_win_count || 0);
        sumLossCount += (r.raw_loss_count || 0);

        if (r.StartDate) {
            if (!minStartDate || r.StartDate < minStartDate) minStartDate = r.StartDate;
        }

        if (r.EndDate) {
            if (!maxEndDate || r.EndDate > maxEndDate) maxEndDate = r.EndDate;
        }
    });

    let totalGroupCount = 0;

    if (totalRecords.length > 0) {
        totalRecords.forEach(t => {
            totalGroupCount += (t.TotalGroups || 0);
        });

        if (totalGroupCount === 0) {
            totalGroupCount = allGroups.length;
        }
    } else {
        totalGroupCount = allGroups.length;
    }

    const mddTimeLines = [];
    const mddValueLines = [];
    let totalMddSum = 0;
    let hasMdd = false;

    totalRecords.forEach((t, index) => {
        const logLabel = t.sourceFileName ? t.sourceFileName : `로그 ${index + 1}`;

        const mddTime = t.mdd_time || "-";
        const mddValue = typeof t.mdd_value === "number" && !isNaN(t.mdd_value)
            ? t.mdd_value
            : "";

        mddTimeLines.push(`${index + 1}. ${logLabel} : ${mddTime}`);
        mddValueLines.push(`${index + 1}. ${logLabel} : ${mddValue}`);

        if (typeof t.mdd_value === "number" && !isNaN(t.mdd_value)) {
            totalMddSum += t.mdd_value;
            hasMdd = true;
        }
    });

    return {
        totalGroupCount,
        minStartDate,
        maxEndDate,
        sumProfit,
        sumLossAmount,
        sumFee,
        sumRealized,
        sumUnrealized,
        sumNetProfit,
        sumWinCount,
        sumLossCount,
        totalWinRate: calculateWinRate(sumWinCount, sumLossCount),
        logMddTimes: mddTimeLines.join("\n"),
        logMddValues: mddValueLines.join("\n"),
        totalMddSum: hasMdd ? Number(totalMddSum.toFixed(2)) : ""
    };
}

    function downloadGroup(groupKey, groupLabel) {
    const fileData = groupFiles[groupKey];
    if (!fileData || fileData.length === 0) return;

    let allGroups = [];
    let totalRecords = [];
    
    fileData.forEach(file => {
        if (file.data.groups) {
            allGroups = allGroups.concat(file.data.groups);
        }

        if (file.data.total) {
            totalRecords.push({
                ...file.data.total,
                sourceFileName: file.fileName
            });
        }
    });

    allGroups.sort((a, b) => (a.GroupName || "").localeCompare((b.GroupName || "")));

    const topSummary = buildTopSummary(totalRecords, allGroups);

    const totalHeaders = [
        "전체 그룹 수",
        "시작일",
        "종료일",
        "총익절금액",
        "총손절금액",
        "총수수료",
        "총확정손익금",
        "총미실현손익",
        "총순이익",
        "총익절횟수",
        "총손절횟수",
        "전체승률",
        "로그별 MDD 시기",
        "로그별 MDD 값",
        "전체 MDD 합"
    ];
    
    const totalRow = [
        topSummary.totalGroupCount,
        topSummary.minStartDate,
        topSummary.maxEndDate,
        topSummary.sumProfit,
        topSummary.sumLossAmount,
        topSummary.sumFee,
        topSummary.sumRealized,
        topSummary.sumUnrealized,
        topSummary.sumNetProfit,
        topSummary.sumWinCount,
        topSummary.sumLossCount,
        topSummary.totalWinRate,
        topSummary.logMddTimes,
        topSummary.logMddValues,
        topSummary.totalMddSum
    ];

    const groupHeaders = [
        "Group Name",
        "시작일",
        "종료일",
        "익절금액",
        "손절금액",
        "수수료",
        "확정손익금",
        "미실현손익",
        "순이익",
        "익절횟수",
        "손절횟수",
        "승률",
        "MDD 시기",
        "MDD 값"
    ];
    
    let wsData = [totalHeaders, totalRow, [], [], groupHeaders];

    allGroups.forEach(g => {
        wsData.push([
            g.GroupName,
            g.StartDate,
            g.EndDate,
            g.raw_profit,
            g.calc_loss_amount,
            g.raw_fee,
            g.calc_realized_pnl,
            g.calc_unrealized_pnl,
            g.calc_net_profit,
            g.raw_win_count,
            g.raw_loss_count,
            g.calc_win_rate,
            g.mdd_time,
            g.mdd_value
        ]);
    });

    const ws = XLSX.utils.aoa_to_sheet(wsData);

    const mddLineCount = topSummary.logMddTimes
        ? topSummary.logMddTimes.split("\n").length
        : 1;

    ws['!rows'] = [];
    ws['!rows'][1] = { hpt: Math.max(22, mddLineCount * 18) };

    applyExcelStyle(ws, 0, 4);

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Total_Result");
    XLSX.writeFile(wb, `그룹${groupLabel}_통합결과.xlsx`);
}

    function downloadAllGroups() {
        const sortedGroups = Object.keys(groupFiles).sort((a, b) => {
            const numA = parseInt(a.split('_')[1]);
            const numB = parseInt(b.split('_')[1]);
            return numA - numB;
        });

        sortedGroups.forEach((groupKey, index) => {
            const groupLabel = String.fromCharCode(65 + index);
            setTimeout(() => {
                downloadGroup(groupKey, groupLabel);
            }, index * 500);
        });
    }
</script>
